<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="css.css" />
    <link rel="icon" href="logopage.jpg" type="image/png" />
  </head>
  <body>
    <div>
      <p>Rock Paper Scissors</p>
      <p>Game</p>
      <p class="js-result"></p>
      <p class="js-score"></p>
      <div class="pic-style">
        <p class="js-left"></p>
        <div>
          <img class="js-rock" src="rock.jpg" alt="Rock picture" />
        </div>
        <div>
          <img class="js-paper" src="paper.jpg" alt="Paper picture" />
        </div>
        <div>
          <img class="js-scissors" src="scissors.jpg" alt="Scissors picture" />
        </div>
        <div class="side">
          <p>Shortcut Key</p>
          <p>Rock: R</p>
          <p>Paper: P</p>
          <p>Scissors: S</p>
          <p>Reset: Q</p>
          <button class="js-reset reset-btn">Reset Score</button>
        </div>
      </div>

      <div class="btn">
        <button class="js-rock-btn">Rock</button>
        <button class="js-paper-btn">Paper</button>
        <button class="js-scissors-btn">Scissors</button>
      </div>
    </div>
  </body>
  <script src="javascript.js"></script>
</html>
